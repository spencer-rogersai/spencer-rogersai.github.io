name: Validate static site

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -e
          shopt -s globstar nullglob

          files=(assets/*.js data/*.js)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No JavaScript files found."
            exit 0
          fi

          for file in "${files[@]}"; do
            echo "Checking $file"
            node --check "$file"
          done

      - name: Verify required page files exist
        shell: bash
        run: |
          set -e
          for file in index.html competitor-map.html market-explorer.html referral-finder.html qa.html; do
            if [ ! -f "$file" ]; then
              echo "Missing required file: $file"
              exit 1
            fi
          done
          echo "Required site files are present."
